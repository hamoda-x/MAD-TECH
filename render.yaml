services:
  - type: web
    name: mad-tech
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://mad-tech.onrender.com
      - key: FRONTEND_URL
        value: https://mad-tech.onrender.com
      - key: BACKEND_URL
        value: http://localhost:3001
      - key: WHATSAPP_NUMBER
        sync: false

databases:
  - name: mad-tech-db
    plan: free
    databaseName: mad_tech
